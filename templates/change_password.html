{% extends "base.html" %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">SECURITY</p><h1>修改密码</h1></div></div>
<form method="post" class="panel form-panel narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="stack-form"><label>当前密码<input type="password" name="old_password" required></label><label>新密码<input type="password" name="new_password" minlength="8" required><small>至少 8 个字符</small></label><label>确认新密码<input type="password" name="confirm_password" minlength="8" required></label></div>
  <div class="form-actions"><a class="button" href="{{ url_for('dashboard') }}">取消</a><button class="button primary">修改密码</button></div>
</form>
{% endblock %}
